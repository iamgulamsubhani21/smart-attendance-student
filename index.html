<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Attendance</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 15px;
    }

    .session {
      font-weight: bold;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 7px;
      background: #1976d2;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      background: black;

      /* Mirror camera preview */
      transform: scaleX(-1);
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
      line-height: 1.5;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>Student Attendance</h1>

  <p>
    Attendance Session Active ✅
  </p>

  <div class="session">
    Session ID:
    <span id="sessionText">Loading...</span>
  </div>


  <button
    id="cameraBtn"
    onclick="openCamera()">

    OPEN CAMERA

  </button>


  <video
    id="camera"
    autoplay
    playsinline>
  </video>


  <button
    id="verifyBtn"
    onclick="verifyFace()"
    disabled>

    VERIFY FACE

  </button>


  <div id="status">

    Loading face recognition...

  </div>

</div>


<script>


// ==========================================
// GOOGLE APPS SCRIPT URL
// ==========================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwy9mrcG_YRMltruegNF5Ai5KFRvWj1wSpuN2FzgixBO7No9v7R15PzXdynpk-kkwfF/exec";


// ==========================================
// FACE MODEL URL
// ==========================================

const MODEL_URL =
"https://justadudewhohacks.github.io/face-api.js/models";


// ==========================================
// GET SESSION ID FROM QR URL
// ==========================================

const params =
new URLSearchParams(
  window.location.search
);


const sessionId =
params.get("session");


document.getElementById(
  "sessionText"
).innerText =
sessionId || "Not Found";


// ==========================================
// LOAD FACE MODELS
// ==========================================

async function loadModels() {

  const status =
    document.getElementById("status");

  status.innerText =
    "Loading face recognition...";


  try {

    await faceapi.nets.ssdMobilenetv1
      .loadFromUri(MODEL_URL);


    await faceapi.nets.faceLandmark68Net
      .loadFromUri(MODEL_URL);


    await faceapi.nets.faceRecognitionNet
      .loadFromUri(MODEL_URL);


    status.innerText =
      "Face recognition ready ✅";


  }

  catch(error) {

    console.error(error);

    status.innerText =
      "Model Error: " +
      error.message;

  }

}


// ==========================================
// OPEN CAMERA
// ==========================================

async function openCamera() {

  const video =
    document.getElementById("camera");

  const status =
    document.getElementById("status");


  status.innerText =
    "Requesting camera permission...";


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera is not supported by this browser."
      );

    }


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });


    video.srcObject =
      stream;


    status.innerText =
      "Camera is working ✅\n" +
      "Face camera ke saamne rakho.";


    document.getElementById(
      "verifyBtn"
    ).disabled = false;


  }

  catch(error) {

    console.error(error);

    status.innerText =
      "Camera Error: " +
      error.message;

  }

}


// ==========================================
// VERIFY FACE
// ==========================================

async function verifyFace() {

  const video =
    document.getElementById("camera");

  const status =
    document.getElementById("status");

  const verifyBtn =
    document.getElementById("verifyBtn");


  if (!sessionId) {

    status.innerText =
      "Session ID not found ❌";

    return;

  }


  verifyBtn.disabled =
    true;


  status.innerText =
    "Detecting face...";


  try {

    // ======================================
    // DETECT FACE
    // ======================================

    const detection =
      await faceapi
        .detectSingleFace(
          video,
          new faceapi.SsdMobilenetv1Options()
        )
        .withFaceLandmarks()
        .withFaceDescriptor();


    if (!detection) {

      status.innerText =
        "Face not detected ❌\n" +
        "Face camera ke saamne rakho.";

      verifyBtn.disabled =
        false;

      return;

    }


    status.innerText =
      "Face detected ✅\n" +
      "Verifying face...";


    // ======================================
    // GET 128 NUMBER FACE EMBEDDING
    // ======================================

    const embedding =
      Array.from(
        detection.descriptor
      );


    // ======================================
    // SEND TO GOOGLE APPS SCRIPT
    // ======================================

    await fetch(
      SCRIPT_URL,
      {

        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type": "text/plain"
        },

        body: JSON.stringify({

          action:
            "verifyFace",

          sessionId:
            sessionId,

          embedding:
            embedding

        })

      }
    );


    // ======================================
    // IMPORTANT
    // ======================================
    //
    // no-cors response browser mein
    // read nahi ho sakta.
    //
    // Lekin Apps Script request receive
    // karke Attendance_Logs mein attendance
    // mark karega.
    //


    status.innerText =
      "Face verification request sent ✅\n" +
      "Attendance process complete.";


  }

  catch(error) {

    console.error(error);

    status.innerText =
      "Face Verification Error: " +
      error.message;

    verifyBtn.disabled =
      false;

  }

}


// ==========================================
// START
// ==========================================

window.addEventListener(
  "load",
  loadModels
);


</script>

</body>

</html>
