<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Enrollment</title>

  <!-- Face API -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 25px 15px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      background: black;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Student Face Enrollment</h1>

  <input
    type="text"
    id="pid"
    placeholder="Enter PID"
  >

  <input
    type="text"
    id="studentName"
    placeholder="Enter Student Name"
  >

  <select id="className">
    <option value="">-- Select Class --</option>

    <option value="B.Tech CSE 2nd Year">
      B.Tech CSE 2nd Year
    </option>
  </select>

  <button onclick="openCamera()">
    OPEN CAMERA
  </button>

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <button
    id="registerBtn"
    onclick="registerFace()"
    disabled>
    REGISTER FACE
  </button>

  <div id="status">
    Loading face recognition...
  </div>

</div>


<script>

// ==========================================
// GOOGLE APPS SCRIPT URL
// ==========================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwy9mrcG_YRMltruegNF5Ai5KFRvWj1wSpuN2FzgixBO7No9v7R15PzXdynpk-kkwfF/exec";


// ==========================================
// FACE MODEL URL
// ==========================================

const MODEL_URL =
"https://justadudewhohacks.github.io/face-api.js/models";


// ==========================================
// LOAD MODELS
// ==========================================

async function loadModels() {

  try {

    await faceapi.nets.ssdMobilenetv1
      .loadFromUri(MODEL_URL);

    await faceapi.nets.faceLandmark68Net
      .loadFromUri(MODEL_URL);

    await faceapi.nets.faceRecognitionNet
      .loadFromUri(MODEL_URL);

    document.getElementById("status").innerText =
      "Face recognition ready ✅";

  }

  catch(error) {

    document.getElementById("status").innerText =
      "Model Error: " + error.message;

  }

}


// ==========================================
// OPEN CAMERA
// ==========================================

async function openCamera() {

  const video =
    document.getElementById("camera");

  const status =
    document.getElementById("status");

  status.innerText =
    "Requesting camera permission...";

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    video.srcObject = stream;

    status.innerText =
      "Camera is working ✅ Face camera ke saamne rakho.";

    document.getElementById("registerBtn")
      .disabled = false;

  }

  catch(error) {

    status.innerText =
      "Camera Error: " + error.message;

  }

}


// ==========================================
// REGISTER FACE
// ==========================================

async function registerFace() {

  const pid =
    document.getElementById("pid").value.trim();

  const name =
    document.getElementById("studentName").value.trim();

  const className =
    document.getElementById("className").value;


  if (!pid || !name || !className) {

    alert(
      "PID, Student Name and Class required."
    );

    return;

  }


  document.getElementById("status").innerText =
    "Detecting face...";


  try {

    const video =
      document.getElementById("camera");


    const detection =
      await faceapi
        .detectSingleFace(
          video,
          new faceapi.SsdMobilenetv1Options()
        )
        .withFaceLandmarks()
        .withFaceDescriptor();


    if (!detection) {

      document.getElementById("status").innerText =
        "Face not detected ❌ Please look at camera.";

      return;

    }


    // 128-number face embedding
    const embedding =
      Array.from(detection.descriptor);


    document.getElementById("status").innerText =
      "Face detected ✅ Saving...";


    // ========================================
    // SEND TO GOOGLE APPS SCRIPT
    // ========================================

    await fetch(SCRIPT_URL, {

      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type": "text/plain"
      },

      body: JSON.stringify({

        action: "saveFace",

        pid: pid,

        studentName: name,

        className: className,

        embedding: embedding

      })

    });


    document.getElementById("status").innerText =
      "Face registration request sent ✅";


  }

  catch(error) {

    document.getElementById("status").innerText =
      "Face Recognition Error: " +
      error.message;

  }

}


// ==========================================
// START
// ==========================================

window.onload = loadModels;

</script>

</body>
</html>
